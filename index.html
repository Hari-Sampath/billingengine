<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Billing Engine — Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0D10;
    --panel: #14171B;
    --panel-hover: #191D22;
    --border: #23272C;
    --text: #E7E9EA;
    --muted: #7D848B;
    --muted-2: #52585E;
    --green: #3ECF8E;
    --green-dim: #1B3A2C;
    --red: #E5484D;
    --red-dim: #3A1E1F;
    --focus: #5B8DEF;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  a, button { font-family: inherit; }

  ::selection { background: var(--focus); color: #fff; }

  *:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }

  .app {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
  }

  .brand {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .brand .dot {
    color: var(--green);
  }

  .breadcrumb {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .breadcrumb .seg {
    cursor: pointer;
  }

  .breadcrumb .seg:hover { color: var(--text); }
  .breadcrumb .seg.current {
    color: var(--text);
    cursor: default;
  }

  .breadcrumb .sep { color: var(--muted-2); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }

  .panel-head h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s ease;
  }

  .row:last-child { border-bottom: none; }
  .row:hover { background: var(--panel-hover); }
  .row:focus-visible { background: var(--panel-hover); }

  .row.static { cursor: default; }
  .row.static:hover { background: none; }

  .row-main {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .row-email {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-sub {
    font-size: 12px;
    color: var(--muted);
  }

  .row-side {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
  }

  .pill.succeeded { background: var(--green-dim); color: var(--green); }
  .pill.failed { background: var(--red-dim); color: var(--red); }

  .chevron { color: var(--muted-2); font-size: 14px; }

  .amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    text-align: right;
  }

  .empty {
    padding: 48px 24px;
    text-align: center;
    color: var(--muted);
  }

  .empty .glyph {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    color: var(--muted-2);
    margin-bottom: 10px;
  }

  .empty p { margin: 4px 0; font-size: 13px; }

  .section-gap { margin-top: 28px; }

  .btn {
    background: var(--text);
    color: #0B0D10;
    border: none;
    border-radius: 7px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.12s ease;
  }

  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn.secondary:hover { background: var(--panel-hover); opacity: 1; }

  .form-panel {
    padding: 18px;
  }

  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .field input, .field select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .field input:focus, .field select:focus {
    border-color: var(--focus);
  }

  .field-row {
    display: flex;
    gap: 12px;
  }

  .field-row .field { flex: 1; }

  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 4px;
  }

  .status-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 10px 18px;
    border-top: 1px solid var(--border);
  }

  .status-line.ok { color: var(--green); }
  .status-line.err { color: var(--red); }

  .loading {
    padding: 40px;
    text-align: center;
    color: var(--muted-2);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }

  .fab-new {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }

  .fab-new:hover { border-color: var(--muted-2); color: var(--text); }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .row { transition: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand"><span class="dot">●</span>&nbsp; billing-engine</div>
  </header>

  <div id="breadcrumb" class="breadcrumb"></div>

  <!-- SCREEN 1: CUSTOMER LIST -->
  <div id="screen-customers">
    <div class="panel">
      <div class="panel-head"><h2>Customers</h2></div>
      <div id="customer-list"></div>
    </div>
    <button class="fab-new" id="btn-new-charge">+ New charge (creates customer if new)</button>
  </div>

  <!-- SCREEN 2: CUSTOMER DETAIL -->
  <div id="screen-detail" class="hidden">
    <div class="panel">
      <div class="panel-head"><h2 id="detail-title">Transactions</h2></div>
      <div id="transaction-list"></div>
    </div>

    <div class="panel section-gap">
      <div class="panel-head"><h2>Charge this customer</h2></div>
      <div class="form-panel">
        <div class="field-row">
          <div class="field">
            <label for="charge-amount">Amount (cents)</label>
            <input type="number" id="charge-amount" value="1999" min="1" />
          </div>
          <div class="field">
            <label for="charge-currency">Currency</label>
            <input type="text" id="charge-currency" value="usd" />
          </div>
        </div>
        <div class="field">
          <label for="charge-token">Test token</label>
          <select id="charge-token">
            <option value="tok_visa">tok_visa — success</option>
            <option value="tok_chargeDeclined">tok_chargeDeclined — generic decline</option>
            <option value="tok_chargeDeclinedInsufficientFunds">tok_chargeDeclinedInsufficientFunds</option>
            <option value="tok_chargeDeclinedExpiredCard">tok_chargeDeclinedExpiredCard</option>
            <option value="tok_chargeDeclinedIncorrectCvc">tok_chargeDeclinedIncorrectCvc</option>
          </select>
        </div>
        <div class="form-actions">
          <button class="btn" id="btn-submit-charge">Charge customer</button>
        </div>
      </div>
      <div id="charge-status"></div>
    </div>
  </div>

  <!-- NEW CHARGE MODAL (inline panel, not a real modal — keeps it simple) -->
  <div id="screen-new-charge" class="hidden">
    <div class="panel">
      <div class="panel-head"><h2>New charge</h2></div>
      <div class="form-panel">
        <div class="field">
          <label for="new-email">Customer email</label>
          <input type="email" id="new-email" placeholder="customer@example.com" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="new-amount">Amount (cents)</label>
            <input type="number" id="new-amount" value="1999" min="1" />
          </div>
          <div class="field">
            <label for="new-currency">Currency</label>
            <input type="text" id="new-currency" value="usd" />
          </div>
        </div>
        <div class="field">
          <label for="new-token">Test token</label>
          <select id="new-token">
            <option value="tok_visa">tok_visa — success</option>
            <option value="tok_chargeDeclined">tok_chargeDeclined — generic decline</option>
            <option value="tok_chargeDeclinedInsufficientFunds">tok_chargeDeclinedInsufficientFunds</option>
            <option value="tok_chargeDeclinedExpiredCard">tok_chargeDeclinedExpiredCard</option>
            <option value="tok_chargeDeclinedIncorrectCvc">tok_chargeDeclinedIncorrectCvc</option>
          </select>
        </div>
        <div class="form-actions">
          <button class="btn secondary" id="btn-cancel-new">Cancel</button>
          <button class="btn" id="btn-submit-new">Create &amp; charge</button>
        </div>
      </div>
      <div id="new-charge-status"></div>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'http://localhost:8080/api';

  let currentCustomer = null; // { id, email }

  const el = (id) => document.getElementById(id);

  function formatMoney(cents, currency) {
    return `${(cents / 100).toFixed(2)} ${currency.toUpperCase()}`;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function show(screenId) {
    ['screen-customers', 'screen-detail', 'screen-new-charge'].forEach(id => {
      el(id).classList.toggle('hidden', id !== screenId);
    });
  }

  function renderBreadcrumb() {
    const bc = el('breadcrumb');
    bc.innerHTML = '';

    const root = document.createElement('span');
    root.className = 'seg' + (!currentCustomer ? ' current' : '');
    root.textContent = '> customers';
    root.onclick = () => { currentCustomer = null; loadCustomers(); };
    bc.appendChild(root);

    if (currentCustomer) {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '/';
      bc.appendChild(sep);

      const leaf = document.createElement('span');
      leaf.className = 'seg current mono';
      leaf.textContent = currentCustomer.email;
      bc.appendChild(leaf);
    }
  }

  // ---------- SCREEN 1: CUSTOMERS ----------

  async function loadCustomers() {
    show('screen-customers');
    renderBreadcrumb();
    const list = el('customer-list');
    list.innerHTML = '<div class="loading">reading ledger…</div>';

    try {
      const res = await fetch(`${API_BASE}/customers`);
      if (!res.ok) throw new Error(`Server responded ${res.status}`);
      const customers = await res.json();
      renderCustomerList(customers);
    } catch (err) {
      list.innerHTML = `
        <div class="empty">
          <div class="glyph">✕</div>
          <p>Could not reach the billing engine.</p>
          <p style="color:var(--muted-2)">${err.message} — is the Spring Boot app running on :8080?</p>
        </div>`;
    }
  }

  function renderCustomerList(customers) {
    const list = el('customer-list');
    list.innerHTML = '';

    if (customers.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <div class="glyph">·</div>
          <p>No customers yet.</p>
          <p style="color:var(--muted-2)">Charge someone for the first time to add them here.</p>
        </div>`;
      return;
    }

    customers.forEach(c => {
      const row = document.createElement('div');
      row.className = 'row';
      row.tabIndex = 0;
      row.setAttribute('role', 'button');
      row.onclick = () => openCustomer(c.id, c.email);
      row.onkeypress = (e) => { if (e.key === 'Enter') openCustomer(c.id, c.email); };

      row.innerHTML = `
        <div class="row-main">
          <div class="row-email">${escapeHtml(c.email)}</div>
          <div class="row-sub">${c.transactionCount} transaction${c.transactionCount === 1 ? '' : 's'}</div>
        </div>
        <div class="row-side">
          ${c.hasFailedTransaction ? '<span class="pill failed">Failed</span>' : ''}
          <span class="chevron">›</span>
        </div>
      `;
      list.appendChild(row);
    });
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- SCREEN 2: CUSTOMER DETAIL ----------

  async function openCustomer(id, email) {
    currentCustomer = { id, email };
    show('screen-detail');
    renderBreadcrumb();
    el('charge-status').innerHTML = '';

    const list = el('transaction-list');
    list.innerHTML = '<div class="loading">loading transactions…</div>';

    try {
      const res = await fetch(`${API_BASE}/customers/${id}/transactions`);
      if (!res.ok) throw new Error(`Server responded ${res.status}`);
      const txs = await res.json();
      renderTransactionList(txs);
    } catch (err) {
      list.innerHTML = `<div class="empty"><div class="glyph">✕</div><p>${err.message}</p></div>`;
    }
  }

  function renderTransactionList(txs) {
    const list = el('transaction-list');
    list.innerHTML = '';

    if (txs.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <div class="glyph">·</div>
          <p>No transactions for this customer yet.</p>
        </div>`;
      return;
    }

    txs.forEach(t => {
      const row = document.createElement('div');
      row.className = 'row static';
      row.innerHTML = `
        <div class="row-main">
          <div class="row-email mono">${t.stripeChargeId || t.stripeCustomerId || 'no stripe id'}</div>
          <div class="row-sub">${formatDate(t.createdAt)}</div>
        </div>
        <div class="row-side">
          <span class="pill ${t.status.toLowerCase()}">${t.status}</span>
          <span class="amount">${formatMoney(t.amountInCents, t.currency)}</span>
        </div>
      `;
      list.appendChild(row);
    });
  }

  async function submitChargeToCurrentCustomer() {
    if (!currentCustomer) return;

    const amountInCents = parseInt(el('charge-amount').value, 10);
    const currency = el('charge-currency').value.trim();
    const testToken = el('charge-token').value;
    const statusBox = el('charge-status');
    const btn = el('btn-submit-charge');

    btn.disabled = true;
    statusBox.innerHTML = '<div class="status-line mono">sending to stripe…</div>';

    try {
      const res = await fetch(`${API_BASE}/customers/${currentCustomer.id}/charge`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amountInCents, currency, testToken })
      });
      if (!res.ok) throw new Error(`Server responded ${res.status}`);
      const tx = await res.json();

      statusBox.innerHTML = tx.status === 'SUCCEEDED'
        ? `<div class="status-line ok">✓ charge ${tx.stripeChargeId} succeeded</div>`
        : `<div class="status-line err">✕ charge failed — no funds captured</div>`;

      openCustomer(currentCustomer.id, currentCustomer.email);
    } catch (err) {
      statusBox.innerHTML = `<div class="status-line err">✕ ${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  // ---------- NEW CUSTOMER + CHARGE ----------

  function openNewCharge() {
    show('screen-new-charge');
    el('new-charge-status').innerHTML = '';
    el('new-email').value = '';
  }

  async function submitNewCharge() {
    const email = el('new-email').value.trim();
    const amountInCents = parseInt(el('new-amount').value, 10);
    const currency = el('new-currency').value.trim();
    const testToken = el('new-token').value;
    const statusBox = el('new-charge-status');
    const btn = el('btn-submit-new');

    if (!email) {
      statusBox.innerHTML = '<div class="status-line err">✕ enter a customer email first</div>';
      return;
    }

    btn.disabled = true;
    statusBox.innerHTML = '<div class="status-line mono">sending to stripe…</div>';

    try {
      const res = await fetch(`${API_BASE}/charges`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, amountInCents, currency, testToken })
      });
      if (!res.ok) throw new Error(`Server responded ${res.status}`);
      await res.json();

      loadCustomers();
    } catch (err) {
      statusBox.innerHTML = `<div class="status-line err">✕ ${err.message}</div>`;
      btn.disabled = false;
    }
  }

  // ---------- WIRE UP ----------

  el('btn-new-charge').onclick = openNewCharge;
  el('btn-cancel-new').onclick = loadCustomers;
  el('btn-submit-new').onclick = submitNewCharge;
  el('btn-submit-charge').onclick = submitChargeToCurrentCustomer;

  loadCustomers();
</script>

</body>
</html>
